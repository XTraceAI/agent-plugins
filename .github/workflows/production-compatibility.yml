name: production-compatibility
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  probe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: All plugin regression suites, with and without the MCP SDK
        run: bash scripts/check-plugin.sh

  host-install:
    name: Install and upgrade (${{ matrix.host }}${{ matrix.package == 'candidate' && ' candidate' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: codex
          - host: claude
          - host: claude
            package: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/prepare-release-candidate.py --host '${{ matrix.host }}' --temp "$RUNNER_TEMP/packages" ${{ matrix.package == 'candidate' && '--candidate-head' || '' }}
      - run: bash scripts/install-release-host.sh '${{ matrix.host }}'
      - name: Fresh install and upgrade from the previous immutable release
        run: >-
          python3 scripts/check-host-install.py --host '${{ matrix.host }}'
          --executable '${{ matrix.host == 'cursor' && 'cursor-agent' || matrix.host }}'
          --plugin-root "$RELEASE_PACKAGE" --previous-root "$PREVIOUS_PACKAGE"
          --source-sha "$RELEASE_SHA" --report "$RUNNER_TEMP/host-reports/install.json"
      - name: Unsupported version notice, stale gate suspension, policy rollback
        if: always() && env.RELEASE_PACKAGE != ''
        run: >-
          python3 scripts/check-upgrade-contract.py --plugin-root "$RELEASE_PACKAGE"
          --source-sha "$RELEASE_SHA" --report "$RUNNER_TEMP/host-reports/upgrade-policy.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-install-${{ matrix.host }}-${{ matrix.package || 'selected' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-reports
          if-no-files-found: warn
          retention-days: 30

  agent-session:
    name: Real agent session (${{ matrix.host }}${{ matrix.package == 'candidate' && ' candidate' || '' }})
    if: >-
      (vars.MEMHUB_PLUGIN_PROD_CHECKS_ENABLED == 'true' || vars.MEMHUB_PLUGIN_RELEASE_GATE_ENFORCED == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: production-plugin-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: codex
            model_variable: MEMHUB_E2E_CODEX_MODEL
          - host: claude
            model_variable: MEMHUB_E2E_CLAUDE_MODEL
          - host: claude
            package: candidate
            model_variable: MEMHUB_E2E_CLAUDE_MODEL
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/prepare-release-candidate.py --host '${{ matrix.host }}' --temp "$RUNNER_TEMP/packages" ${{ matrix.package == 'candidate' && '--candidate-head' || '' }}
      - run: bash scripts/install-release-host.sh '${{ matrix.host }}'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare Codex Linux sandbox
        if: matrix.host == 'codex'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          # Ubuntu 24.04 requires the distribution's bwrap user-namespace profile.
          # https://learn.chatgpt.com/docs/sandboxing
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --ro-bind / / --unshare-user -- /bin/true
      - name: Rule delivery, gate enforcement, allowed operation, capture, and upgrade notice
        env:
          CODEX_API_KEY: ${{ matrix.host == 'codex' && secrets.MEMHUB_E2E_OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.host == 'claude' && secrets.MEMHUB_E2E_ANTHROPIC_API_KEY || '' }}
          CURSOR_API_KEY: ${{ matrix.host == 'cursor' && secrets.MEMHUB_E2E_CURSOR_API_KEY || '' }}
          MEMHUB_E2E_MODEL: ${{ vars[matrix.model_variable] }}
          MEMHUB_PROD_E2E_TOKEN: ${{ secrets.MEMHUB_PROD_E2E_TOKEN }}
          MEMHUB_PROD_E2E_FIXTURE_JSON: ${{ vars.MEMHUB_PROD_E2E_FIXTURE_JSON }}
        run: >-
          python3 scripts/check-agent-session.py --host '${{ matrix.host }}'
          --executable '${{ matrix.host == 'cursor' && 'cursor-agent' || matrix.host }}'
          --plugin-root "$RELEASE_PACKAGE" --source-sha "$RELEASE_SHA"
          --report "$RUNNER_TEMP/agent-reports/session.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-agent-${{ matrix.host }}-${{ matrix.package || 'selected' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-reports
          if-no-files-found: warn
          retention-days: 30

  production:
    # Forks get offline tests, never production credentials. The aggregate fails
    # on a skipped live job; a maintainer must promote reviewed code in this repo.
    if: >-
      (vars.MEMHUB_PLUGIN_PROD_CHECKS_ENABLED == 'true' || vars.MEMHUB_PLUGIN_RELEASE_GATE_ENFORCED == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: production-plugin-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the actual Claude marketplace release
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          catalog = json.loads(pathlib.Path('.claude-plugin/marketplace.json').read_text())
          entries = [p for p in catalog['plugins'] if p['name'] == 'memhub']
          assert len(entries) == 1, 'expected one MemHub marketplace entry'
          source = entries[0]['source']
          assert source['source'] == 'git-subdir'
          assert source['url'] == 'https://github.com/XTraceAI/agent-plugins.git'
          assert source['path'] == 'plugins/memhub'
          sha, tag = source['sha'], source['ref']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Claude SHA must be immutable'
          assert re.fullmatch(r'memhub--v[0-9]+\.[0-9]+\.[0-9]+', tag), 'invalid Claude tag'
          resolved = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          assert resolved == sha, 'Claude tag does not resolve to its pinned SHA'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'claude-release'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(target), sha], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'CLAUDE_RELEASE_SHA={sha}\n')
          PY
      - name: Check Codex and Cursor package against live production
        env:
          MEMHUB_PROD_READ_TOKEN: ${{ secrets.MEMHUB_PROD_READ_TOKEN }}
          MEMHUB_PROD_FIXTURE_JSON: ${{ vars.MEMHUB_PROD_FIXTURE_JSON }}
        run: >-
          python3 scripts/check-production-compatibility.py
          --plugin-root plugins/memhub --source-sha "$(git rev-parse HEAD)"
          --report "$RUNNER_TEMP/prod-reports/main.json"
      - name: Check the pinned Claude package against live production
        env:
          MEMHUB_PROD_READ_TOKEN: ${{ secrets.MEMHUB_PROD_READ_TOKEN }}
          MEMHUB_PROD_FIXTURE_JSON: ${{ vars.MEMHUB_PROD_FIXTURE_JSON }}
        run: >-
          python3 scripts/check-production-compatibility.py
          --plugin-root "$RUNNER_TEMP/claude-release/plugins/memhub"
          --source-sha "$CLAUDE_RELEASE_SHA"
          --report "$RUNNER_TEMP/prod-reports/claude.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prod-reports
          if-no-files-found: ignore
          retention-days: 30

  readiness:
    name: Production plugin readiness
    if: always()
    needs: [probe-tests, host-install, production, agent-session]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          ENFORCED: ${{ vars.MEMHUB_PLUGIN_RELEASE_GATE_ENFORCED }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          passed = bool(results) and all(job['result'] == 'success' for job in results.values())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Codex/Claude release evidence: ' + ('verified' if passed else 'NOT VERIFIED (failed or not run)') + '\n')
              out.write('Cursor: deferred; native install and agent behavior are not verified.\n')
              out.write('Session cleanup: deferred pending backend PAK deletion support (ENG-1074).\n')
              out.write('Session UI rule-fire linkage: deferred (ENG-1075); local hook evidence does not verify backend/UI linkage.\n')
              out.write('Enforcement: ' + ('enabled' if os.environ['ENFORCED'] == 'true' else 'advisory') + '\n')
              out.write('\n| Check group | Result |\n| --- | --- |\n')
              for name, job in results.items():
                  out.write(f"| {name} | {job['result']} |\n")
          if not passed:
              print('::warning::Production plugin release is NOT VERIFIED; checks failed or were not run.')
              if os.environ['ENFORCED'] == 'true':
                  raise SystemExit(1)
          PY
